<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Block Puzzle Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents screen scrolling while dragging */
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden; /* Prevent bouncing on iOS/Android */
        }
        h1 {
            margin: 5px 0;
            font-size: 28px;
        }
        .score-board {
            font-size: 22px;
            margin-bottom: 10px;
        }
        #game-board {
            border: 4px solid #3a3a5a;
            border-radius: 8px;
            background-color: #12121c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 90vw;
            max-height: 90vw;
        }
        #tray {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            height: 100px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .shape-preview {
            cursor: grab;
            touch-action: none;
            background-color: #12121c;
            border-radius: 6px;
            border: 1px solid #3a3a5a;
        }
        .shape-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .rotate-btn {
            background-color: #3a3a5a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        .rotate-btn:hover {
            background-color: #4a4a7a;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
        }
        .reset-btn {
            background-color: #ff6b6b;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .reset-btn:hover {
            background-color: #ff5252;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="tiles_game.html">Tiles Game</a>
        <a href="blocks_game.html" class="active">Blocks Game</a>
    </nav>
    <audio type="audio/mp3" src="sounds/bg_music.mp3" controls autoplay loop unmute></audio>
    <h1>Block Puzzle</h1>
    <div class="score-board">Score: <span id="score">0</span></div>
    
    <!-- Main 8x8 Grid Canvas -->
    <canvas id="game-board" width="320" height="320"></canvas>
    
    <!-- Tray holding the 3 available shapes -->
    <div id="tray">
        <div class="shape-container">
            <canvas id="shape0" class="shape-preview" width="90" height="90"></canvas>
            <button class="rotate-btn" id="rotate0">↻ Rotate</button>
        </div>
        <div class="shape-container">
            <canvas id="shape1" class="shape-preview" width="90" height="90"></canvas>
            <button class="rotate-btn" id="rotate1">↻ Rotate</button>
        </div>
        <div class="shape-container">
            <canvas id="shape2" class="shape-preview" width="90" height="90"></canvas>
            <button class="rotate-btn" id="rotate2">↻ Rotate</button>
        </div>
    </div>

    <!-- Control Buttons -->
    <div class="button-group">
        <button class="reset-btn" id="reset-btn">Give up and reset</button>
    </div>

    <script>
        const GRID_SIZE = 8;
        const CELL_SIZE = 40; // 8 * 40 = 320px
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));

        const SHAPES = [
            { color: '#FF5733', matrix: [[1]] },                             // 1x1 Single
            { color: '#33FF57', matrix: [[1, 1]] },                          // 1x2 Horizontal
            { color: '#3357FF', matrix: [[1], [1]] },                        // 2x1 Vertical
            { color: '#F3FF33', matrix: [[1, 1], [1, 1]] },                  // 2x2 Square
            { color: '#FF33F3', matrix: [[1, 1, 1]] },                       // 1x3 Horizontal
            { color: '#33FFF3', matrix: [[1], [1], [1]] },                   // 3x1 Vertical
            { color: '#FFA500', matrix: [[1, 1, 1], [0, 1, 0]] },            // T-shape
            { color: '#9933FF', matrix: [[1, 0], [1, 0], [1, 1]] },          // L-shape
            { color: '#FF3380', matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]] }   // 3x3 Block
        ];

        let currentShapes = [null, null, null];
        let shapeRotations = [0, 0, 0]; // Track rotation state for each shape
        let usedShapeIndices = new Set(); // Track which shape types have been used
        let draggingIndex = null;
        let dragOffset = { x: 0, y: 0 };
        let pointerPos = { x: 0, y: 0 };
        let isTouchDevice = false;

        function initGame() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            scoreElement.innerText = score;
            usedShapeIndices.clear();
            shapeRotations = [0, 0, 0];
            spawnShapes();
            drawGrid();
        }

        // Rotate a matrix 90 degrees clockwise
        function rotateMatrix(matrix) {
            const rows = matrix.length;
            const cols = matrix[0].length;
            const rotated = Array(cols).fill(null).map(() => Array(rows).fill(0));
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    rotated[c][rows - 1 - r] = matrix[r][c];
                }
            }
            return rotated;
        }

        // Rotate a shape by applying rotation matrix multiple times
        function getRotatedShape(shapeIndex, rotationTimes) {
            const baseShape = SHAPES[shapeIndex];
            let matrix = JSON.parse(JSON.stringify(baseShape.matrix));
            
            const times = rotationTimes % 4; // Only need 0-3 rotations for 90 degree steps
            for (let i = 0; i < times; i++) {
                matrix = rotateMatrix(matrix);
            }
            
            return {
                color: baseShape.color,
                matrix: matrix
            };
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    ctx.strokeStyle = '#2a2a40';
                    ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    
                    if (grid[r][c]) {
                        drawCell(ctx, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, grid[r][c]);
                    }
                }
            }
        }

        function drawCell(context, x, y, size, color) {
            context.fillStyle = color;
            context.fillRect(x + 1, y + 1, size - 2, size - 2);
            context.strokeStyle = 'rgba(255,255,255,0.3)';
            context.strokeRect(x + 2, y + 2, size - 4, size - 4);
        }

        function spawnShapes() {
            for (let i = 0; i < 3; i++) {
                if (currentShapes[i] !== null) continue; // Skip already placed shapes
                
                // Find a shape that hasn't been used yet
                let shapeIndex;
                let attempts = 0;
                do {
                    shapeIndex = Math.floor(Math.random() * SHAPES.length);
                    attempts++;
                } while (usedShapeIndices.has(shapeIndex) && attempts < 100);
                
                // If all shapes have been used (or after 100 attempts), reset the used list
                if (attempts >= 100) {
                    usedShapeIndices.clear();
                    shapeIndex = Math.floor(Math.random() * SHAPES.length);
                }
                
                usedShapeIndices.add(shapeIndex);
                
                // Store both the shape index and the original shape (not rotated yet)
                currentShapes[i] = {
                    shapeIndex: shapeIndex,
                    baseShape: JSON.parse(JSON.stringify(SHAPES[shapeIndex]))
                };
                
                shapeRotations[i] = 0; // Reset rotation
                drawTrayShape(i);
            }
        }

        function drawTrayShape(index) {
            const trayCanvas = document.getElementById(`shape${index}`);
            const tCtx = trayCanvas.getContext('2d');
            tCtx.clearRect(0, 0, trayCanvas.width, trayCanvas.height);

            const shapeData = currentShapes[index];
            if (!shapeData) return;

            // Get the rotated shape based on current rotation
            const rotatedShape = getRotatedShape(shapeData.shapeIndex, shapeRotations[index]);
            const shape = rotatedShape;

            const scale = 18;
            const rows = shape.matrix.length;
            const cols = shape.matrix[0].length;
            
            const offsetX = (trayCanvas.width - cols * scale) / 2;
            const offsetY = (trayCanvas.height - rows * scale) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape.matrix[r][c]) {
                        drawCell(tCtx, offsetX + c * scale, offsetY + r * scale, scale, shape.color);
                    }
                }
            }
        }

        function canPlaceShape(shape, startRow, startCol) {
            const rows = shape.matrix.length;
            const cols = shape.matrix[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape.matrix[r][c]) {
                        const gridR = startRow + r;
                        const gridC = startCol + c;

                        if (gridR < 0 || gridR >= GRID_SIZE || gridC < 0 || gridC >= GRID_SIZE) {
                            return false;
                        }
                        if (grid[gridR][gridC] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placeShape(shape, startRow, startCol) {
            const rows = shape.matrix.length;
            const cols = shape.matrix[0].length;
            let placedCells = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape.matrix[r][c]) {
                        grid[startRow + r][startCol + c] = shape.color;
                        placedCells++;
                    }
                }
            }

            score += placedCells * 10;
            checkLines();
            scoreElement.innerText = score;
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r].every(cell => cell !== 0)) rowsToClear.push(r);
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let full = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === 0) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            rowsToClear.forEach(r => {
                for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = 0;
            });

            colsToClear.forEach(c => {
                for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
            });

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                score += totalCleared * 100;
            }
        }

        // --- Unified Interaction Handlers (Mouse & Touch) ---

        function getPointerCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(index, e) {
            if (!currentShapes[index]) return;
            e.preventDefault();
            
            isTouchDevice = e.type.startsWith('touch');
            draggingIndex = index;

            const trayCanvas = document.getElementById(`shape${index}`);
            const rect = trayCanvas.getBoundingClientRect();
            const coords = getPointerCoords(e);

            dragOffset.x = coords.x - rect.left;
            dragOffset.y = coords.y - rect.top;
        }

        function handleMove(e) {
            if (draggingIndex === null) return;
            e.preventDefault();

            const coords = getPointerCoords(e);
            pointerPos.x = coords.x;
            pointerPos.y = coords.y;

            drawGrid();

            const rect = canvas.getBoundingClientRect();
            const scaleRatio = 320 / rect.width; // Adjust for dynamic canvas scaling
            
            const shapeData = currentShapes[draggingIndex];
            const rotatedShape = getRotatedShape(shapeData.shapeIndex, shapeRotations[draggingIndex]);

            // Touch lift offset: Lift shape slightly above finger so it remains visible
            const fingerOffsetY = isTouchDevice ? 60 : 0;

            const canvasMouseX = (pointerPos.x - rect.left - dragOffset.x) * scaleRatio;
            const canvasMouseY = (pointerPos.y - rect.top - dragOffset.y - fingerOffsetY) * scaleRatio;

            // Draw active shape dragging over board
            for (let r = 0; r < rotatedShape.matrix.length; r++) {
                for (let c = 0; c < rotatedShape.matrix[0].length; c++) {
                    if (rotatedShape.matrix[r][c]) {
                        drawCell(
                            ctx, 
                            canvasMouseX + c * CELL_SIZE, 
                            canvasMouseY + r * CELL_SIZE, 
                            CELL_SIZE, 
                            rotatedShape.color
                        );
                    }
                }
            }
        }

        function handleEnd(e) {
            if (draggingIndex === null) return;

            const rect = canvas.getBoundingClientRect();
            const scaleRatio = 320 / rect.width;

            const fingerOffsetY = isTouchDevice ? 60 : 0;

            const dropX = (pointerPos.x - rect.left - dragOffset.x + (CELL_SIZE / 2)) * scaleRatio;
            const dropY = (pointerPos.y - rect.top - dragOffset.y - fingerOffsetY + (CELL_SIZE / 2)) * scaleRatio;

            const gridCol = Math.floor(dropX / CELL_SIZE);
            const gridRow = Math.floor(dropY / CELL_SIZE);

            const shapeData = currentShapes[draggingIndex];
            
            // Get the rotated shape for placement
            const rotatedShape = getRotatedShape(shapeData.shapeIndex, shapeRotations[draggingIndex]);

            if (canPlaceShape(rotatedShape, gridRow, gridCol)) {
                placeShape(rotatedShape, gridRow, gridCol);
                currentShapes[draggingIndex] = null;

                const trayCanvas = document.getElementById(`shape${draggingIndex}`);
                const tCtx = trayCanvas.getContext('2d');
                tCtx.clearRect(0, 0, trayCanvas.width, trayCanvas.height);

                if (currentShapes.every(s => s === null)) {
                    spawnShapes();
                }
            }

            draggingIndex = null;
            drawGrid();
        }

        // Attach event listeners to tray elements
        for (let i = 0; i < 3; i++) {
            const trayCanvas = document.getElementById(`shape${i}`);
            
            trayCanvas.addEventListener('mousedown', (e) => handleStart(i, e));
            trayCanvas.addEventListener('touchstart', (e) => handleStart(i, e), { passive: false });

            // Add rotation button listener
            const rotateBtn = document.getElementById(`rotate${i}`);
            rotateBtn.addEventListener('click', () => {
                if (currentShapes[i] !== null) {
                    shapeRotations[i] = (shapeRotations[i] + 1) % 4;
                    drawTrayShape(i);
                }
            });
        }

        // Add reset button listener
        const resetBtn = document.getElementById('reset-btn');
        resetBtn.addEventListener('click', () => {
            initGame();
        });

        // Global drag & drop movement listeners
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false });

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        // Start Game
        initGame();
    </script>
</body>
</html>
