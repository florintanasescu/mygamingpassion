<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="pauseBtn" disabled>Pause</button>
    </div>

    <div class="instructions">Use Left/Right Arrows or Mouse to move. Press Space to Pause/Resume.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");

        // Game states
        let isGameStarted = false;
        let isPaused = false;
        let animationFrameId;

        // Ball setup
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 1;
        let dy = -1;
        const ballRadius = 10;

        // Paddle setup
        const paddleHeight = 15;
        const paddleWidth = 120;
        let paddleX = (canvas.width - paddleWidth) / 2;

        // Controls
        let rightPressed = false;
        let leftPressed = false;

        // Blocks setup
        const brickRowCount = 4;
        const brickColumnCount = 7;
        const brickWidth = 95;
        const brickHeight = 25;
        const brickPadding = 12;
        const brickOffsetTop = 40;
        const brickOffsetLeft = 32;

        let score = 0;

        // Initialize block grid
        const bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // Event listeners
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        document.addEventListener("mousemove", mouseMoveHandler, false);

        startBtn.addEventListener("click", startGame);
        pauseBtn.addEventListener("click", togglePause);

        function startGame() {
            if (!isGameStarted) {
                isGameStarted = true;
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                draw();
            }
        }

        function togglePause() {
            if (!isGameStarted) return;

            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = "Resume";
                cancelAnimationFrame(animationFrameId);
                drawPauseOverlay();
            } else {
                pauseBtn.textContent = "Pause";
                draw();
            }
        }

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
            else if (e.key === " " || e.code === "Space") {
                e.preventDefault(); // Prevent page scrolling
                togglePause();
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function mouseMoveHandler(e) {
            if (isPaused) return;
            const relativeX = e.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        // Collision detection with blocks
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            if (score === brickRowCount * brickColumnCount) {
                                alert("YOU WIN, CONGRATULATIONS!");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        // Drawing functions
        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = "#FF5722";
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawScore() {
            ctx.font = "18px Arial";
            ctx.fillStyle = "#FFF";
            ctx.fillText("Score: " + score, 15, 25);
        }

        function drawPauseOverlay() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "30px Arial";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
            ctx.textAlign = "left"; // Reset alignment
        }

        // Main game loop
        function draw() {
            if (isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            drawScore();
            collisionDetection();

            // Wall collision (left/right)
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }

            // Wall collision (top/bottom)
            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    alert("GAME OVER");
                    document.location.reload();
                    return;
                }
            }

            // Move paddle
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 6;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 6;
            }

            x += dx;
            y += dy;
            animationFrameId = requestAnimationFrame(draw);
        }

        // Initial draw of static elements before game starts
        drawBricks();
        drawBall();
        drawPaddle();
        drawScore();
    </script>
</body>
</html>
