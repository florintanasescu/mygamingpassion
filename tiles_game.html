<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Breaker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="pauseBtn" disabled>Pause</button>
    </div>

    <div class="instructions">
        <div id="desktopInstructions">Use Left/Right Arrows or Mouse to move. Press Space to Pause/Resume.</div>
        <div id="mobileInstructions" style="display: none;">Touch and drag to move paddle. Tap Pause button to pause/resume.</div>
    </div>

    <script>
        // Detect if device is mobile first
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                         (window.innerWidth < 768 && window.matchMedia("(hover: none)").matches);
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");

        // Game states - DECLARE FIRST
        let isGameStarted = false;
        let isPaused = false;
        let animationFrameId;

        // Ball setup
        let x = 0;
        let y = 0;
        let dx = 1;
        let dy = -1;
        const ballRadius = 10;

        // Paddle setup
        const paddleHeight = 15;
        let paddleWidth = 120;
        let paddleX = 0;

        // Controls
        let rightPressed = false;
        let leftPressed = false;

        // Blocks setup - will be calculated dynamically
        const brickRowCount = 4;
        const brickColumnCount = 7;
        let brickWidth = 95;
        let brickHeight = 25;
        let brickPadding = 12;
        let brickOffsetTop = 40;
        let brickOffsetLeft = 32;

        let score = 0;

        // Initialize block grid
        const bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
        
        // Calculate responsive brick dimensions
        function calculateBrickDimensions(canvasWidth, canvasHeight) {
            if (isMobile) {
                // For portrait mobile, scale down bricks
                brickPadding = 6;
                brickWidth = (canvasWidth - 60) / brickColumnCount - brickPadding;
                brickHeight = 18;
                brickOffsetTop = 20;
                brickOffsetLeft = 8;
                paddleWidth = canvasWidth * 0.5; // Paddle is 50% of canvas width
            } else {
                // Default desktop sizing
                brickWidth = 95;
                brickHeight = 25;
                brickPadding = 12;
                brickOffsetTop = 40;
                brickOffsetLeft = 32;
                paddleWidth = 120;
            }
        }
        
        // Set canvas size based on device
        function setCanvasSize() {
            let width, height;
            
            if (isMobile) {
                // Portrait mode for mobile
                width = Math.min(window.innerWidth - 40, 500);
                height = (width / 500) * 800; // Portrait ratio (5:8)
            } else {
                // Landscape for desktop
                width = 800;
                height = 500;
            }
            
            canvas.width = width;
            canvas.height = height;
            
            // Calculate responsive brick dimensions based on canvas size
            calculateBrickDimensions(width, height);
            
            // Reinitialize game state variables after resize
            if (isGameStarted === false) {
                x = canvas.width / 2;
                y = canvas.height - 30;
                paddleX = (canvas.width - paddleWidth) / 2;
            }
        }
        
        // Initialize canvas size after getting elements
        setCanvasSize();
        
        // Call initial render after canvas setup
        setTimeout(() => {
            if (typeof renderInitialState !== 'undefined' && !isGameStarted) {
                renderInitialState();
            }
        }, 50);
        
        window.addEventListener("resize", function() {
            setCanvasSize();
            if (!isGameStarted) {
                setTimeout(renderInitialState, 50);
            }
        });
        
        window.addEventListener("orientationchange", function() {
            setTimeout(() => {
                setCanvasSize();
                if (!isGameStarted) {
                    renderInitialState();
                }
            }, 100);
        });

        
        // Show appropriate instructions
        if (isMobile) {
            document.getElementById("desktopInstructions").style.display = "none";
            document.getElementById("mobileInstructions").style.display = "block";
        }

        // Event listeners
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        document.addEventListener("mousemove", mouseMoveHandler, false);
        canvas.addEventListener("touchstart", touchStartHandler, false);
        canvas.addEventListener("touchmove", touchMoveHandler, false);
        canvas.addEventListener("touchend", touchEndHandler, false);

        startBtn.addEventListener("click", function(e) {
            e.preventDefault();
            startGame();
        });
        pauseBtn.addEventListener("click", function(e) {
            e.preventDefault();
            togglePause();
        });

        function startGame() {
            if (!isGameStarted) {
                isGameStarted = true;
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                draw();
            }
        }

        function togglePause() {
            if (!isGameStarted) return;

            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = "Resume";
                cancelAnimationFrame(animationFrameId);
                drawPauseOverlay();
            } else {
                pauseBtn.textContent = "Pause";
                draw();
            }
        }

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
            else if (e.key === " " || e.code === "Space") {
                e.preventDefault(); // Prevent page scrolling
                togglePause();
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function mouseMoveHandler(e) {
            if (isPaused) return;
            const relativeX = e.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        // Touch event handlers for mobile
        let touchStartX = 0;
        
        function touchStartHandler(e) {
            if (isPaused) return;
            const touch = e.touches[0];
            touchStartX = touch.clientX - canvas.getBoundingClientRect().left;
        }
        
        function touchMoveHandler(e) {
            if (isPaused) return;
            e.preventDefault();
            const touch = e.touches[0];
            const relativeX = touch.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }
        
        function touchEndHandler(e) {
            // Touch ended, paddle stays at last position
        }

        // Collision detection with blocks
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            if (score === brickRowCount * brickColumnCount) {
                                alert("YOU WIN, CONGRATULATIONS!");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        // Drawing functions
        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = "#FF5722";
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawScore() {
            ctx.font = "18px Arial";
            ctx.fillStyle = "#FFF";
            ctx.fillText("Score: " + score, 15, 25);
        }

        function drawPauseOverlay() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "30px Arial";
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
            ctx.textAlign = "left"; // Reset alignment
        }

        // Main game loop
        function draw() {
            if (isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            drawScore();
            collisionDetection();

            // Wall collision (left/right)
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }

            // Wall collision (top/bottom)
            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    alert("GAME OVER");
                    document.location.reload();
                    return;
                }
            }

            // Move paddle
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 6;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 6;
            }

            x += dx;
            y += dy;
            animationFrameId = requestAnimationFrame(draw);
        }

        // Initial draw of static elements before game starts
        function renderInitialState() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            drawScore();
        }
        
        renderInitialState();
    </script>
</body>
</html>
