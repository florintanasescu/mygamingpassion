<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-container">

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="tiles_game.html" class="active">Tiles Game</a>
        <a href="blocks_game.html" class="active">Blocks Game</a>
        <a href="sudoku_game.html" class="active">Sudoku</a>
        <a href="snake_game.html" class="active">Snake</a>
    </nav>

    <audio type="audio/mp3" src="sounds/bg_music.mp3" controls loop unmute></audio>

    <h1>Snake</h1>

    <div class="score-board">
        <span>Score: <strong id="score">0</strong></span>
        <span>|</span>
        <span>High Score: <strong id="high-score">0</strong></span>
    </div>

    <canvas id="game-board" width="480" height="480"></canvas>

    <div id="game-message" class="instructions">
        Press an arrow key, WASD, or click a control button to start.
    </div>

    <!-- On-screen D-Pad Controls (Works on both Desktop and Mobile) -->
    <div class="snake-dpad">
        <button id="up-btn" class="dpad-btn up" aria-label="Move up">▲</button>
        <button id="left-btn" class="dpad-btn left" aria-label="Move left">◀</button>
        <button id="down-btn" class="dpad-btn down" aria-label="Move down">▼</button>
        <button id="right-btn" class="dpad-btn right" aria-label="Move right">▶</button>
    </div>

    <div class="button-group">
        <button class="reset-btn" id="reset-btn">New Game</button>
    </div>

    <div class="instructions">
        Eat the food and grow the snake.<br>
        Avoid the walls and your own body.
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/florin.tanasescu.ro/" target="_blank">
            <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.youtube.com/@snalftw" target="_blank">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com/florin.tanasescu.ro/" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.twitch.tv/flo_rao" target="_blank">
            <i class="fab fa-twitch"></i>
        </a>
        <a href="https://x.com/FTnssq" target="_blank">
            <i class="fab fa-x-twitter"></i>
        </a>
    </div>

<script>
const canvas = document.getElementById("game-board");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("high-score");
const messageElement = document.getElementById("game-message");

const GRID_SIZE = 24;
let CELL_SIZE = canvas.width / GRID_SIZE;

let snake = [];
let food = { x: 0, y: 0 };
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let score = 0;
let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
let gameLoop = null;
let gameRunning = false;
let gameOver = false;

highScoreElement.textContent = highScore;

// Dynamically handle board scaling without breaking Desktop layout
function updateCanvasScale() {
    const isMobileDevice = window.innerWidth <= 768;
    if (isMobileDevice) {
        const responsiveSize = Math.min(window.innerWidth - 30, 400);
        canvas.width = responsiveSize;
        canvas.height = responsiveSize;
    } else {
        canvas.width = 480;
        canvas.height = 480;
    }
    CELL_SIZE = canvas.width / GRID_SIZE;
    draw();
}

window.addEventListener("resize", updateCanvasScale);

function initGame() {
    if (gameLoop) {
        clearInterval(gameLoop);
        gameLoop = null;
    }

    snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameRunning = false;
    gameOver = false;

    scoreElement.textContent = score;
    messageElement.textContent = "Press an arrow key, WASD, or click controls to start.";

    updateCanvasScale();
    createFood();
    draw();
}

function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE)
        };
    } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
}

function startGame() {
    if (gameOver) {
        initGame();
    }

    if (!gameRunning) {
        gameRunning = true;
        messageElement.textContent = "";
        gameLoop = setInterval(update, 110);
    }
}

function changeDirection(x, y) {
    // Prevent 180-degree immediate reversal
    if (x === -direction.x && y === -direction.y) {
        return;
    }
    nextDirection = { x, y };
    startGame();
}

function update() {
    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wall collision
    if (
        head.x < 0 ||
        head.x >= GRID_SIZE ||
        head.y < 0 ||
        head.y >= GRID_SIZE
    ) {
        endGame();
        return;
    }

    const eating = head.x === food.x && head.y === food.y;
    const bodyToCheck = eating ? snake : snake.slice(0, -1);

    // Self collision
    if (bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;
        scoreElement.textContent = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            highScoreElement.textContent = highScore;
        }

        createFood();

        // Speed adjustment
        clearInterval(gameLoop);
        const speed = Math.max(55, 110 - Math.floor(score / 50) * 5);
        gameLoop = setInterval(update, speed);
    } else {
        snake.pop();
    }

    draw();
}

function endGame() {
    clearInterval(gameLoop);
    gameLoop = null;
    gameRunning = false;
    gameOver = true;
    messageElement.textContent = "Game Over! Press an arrow key or New Game to restart.";
    draw(true);
}

function draw(gameEnded = false) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid lines
    ctx.strokeStyle = "#2a2a40";
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID_SIZE; i++) {
        const p = i * CELL_SIZE;

        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff6b6b";
    ctx.beginPath();
    ctx.arc(
        food.x * CELL_SIZE + CELL_SIZE / 2,
        food.y * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE * 0.34,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Snake
    snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4ac3e7" : "#0095DD";

        ctx.fillRect(
            segment.x * CELL_SIZE + 2,
            segment.y * CELL_SIZE + 2,
            CELL_SIZE - 4,
            CELL_SIZE - 4
        );

        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.strokeRect(
            segment.x * CELL_SIZE + 3,
            segment.y * CELL_SIZE + 3,
            CELL_SIZE - 6,
            CELL_SIZE - 6
        );
    });

    if (gameEnded) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

// 1. Keyboard Listeners (Desktop)
window.addEventListener("keydown", event => {
    const keyMap = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        W: [0, -1],
        s: [0, 1],
        S: [0, 1],
        a: [-1, 0],
        A: [-1, 0],
        d: [1, 0],
        D: [1, 0]
    };

    if (keyMap[event.key]) {
        event.preventDefault();
        changeDirection(...keyMap[event.key]);
    }
});

// 2. On-screen Controls (Desktop Click + Mobile Touch)
function setupControl(elementId, dx, dy) {
    const el = document.getElementById(elementId);
    if (!el) return;

    el.addEventListener("click", (e) => {
        changeDirection(dx, dy);
    });

    el.addEventListener("touchstart", (e) => {
        e.preventDefault();
        changeDirection(dx, dy);
    }, { passive: false });
}

setupControl("up-btn", 0, -1);
setupControl("down-btn", 0, 1);
setupControl("left-btn", -1, 0);
setupControl("right-btn", 1, 0);

// Reset Button
document.getElementById("reset-btn").addEventListener("click", initGame);

// 3. Touch Swipe Controls (Mobile)
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener("touchmove", (e) => {
    if (gameRunning) e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
    if (!touchStartX || !touchStartY) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) changeDirection(1, 0);
            else changeDirection(-1, 0);
        } else {
            if (dy > 0) changeDirection(0, 1);
            else changeDirection(0, -1);
        }
    }

    touchStartX = 0;
    touchStartY = 0;
});

// Initialize game on load
initGame();
</script>

</body>
</html>
